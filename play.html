<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play · 25 Games by New Year</title>
<meta name="theme-color" content="#0a0818">
<link rel="icon" type="image/png" sizes="32x32" href="art/logo-32.png">
<link rel="apple-touch-icon" href="art/logo-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root { --bg: #0a0818; --line: rgba(160, 140, 255, 0.18); --text: #ece8ff; --muted: #a39cc4; --gold: #ffcf4a; --magenta: #ff3dcf; --cyan: #34f0ff; --pixel: 'Press Start 2P', ui-monospace, monospace; color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000; color: var(--text); overflow: hidden; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; font: 15px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .bar { flex: none; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left)); background: linear-gradient(180deg, #15112b, #0c0a1c); border-bottom: 1px solid var(--line); box-shadow: 0 1px 0 rgba(255, 61, 207, 0.25), 0 0 24px rgba(255, 61, 207, 0.12); position: relative; z-index: 2; }
  .btn { flex: none; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; font: 9px/1 var(--pixel); color: var(--text); text-decoration: none; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; transition: background 0.15s, border-color 0.15s; }
  .btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.35); }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }
  .btn.fs { color: var(--gold); border-color: rgba(255, 207, 74, 0.45); }
  .brand { width: 26px; height: 26px; flex: none; filter: drop-shadow(0 0 8px rgba(255, 61, 207, 0.5)); }
  h1 { flex: 1; min-width: 0; font: 400 11px/1.3 var(--pixel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; letter-spacing: 0.03em; text-shadow: 0 0 12px rgba(52, 240, 255, 0.45); }
  .stage { position: relative; flex: 1; min-height: 0; background: #000; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #000; }
  .loading { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; background: radial-gradient(circle at 50% 45%, #1a1436, var(--bg) 70%); transition: opacity 0.4s; z-index: 1; }
  .loading.done { opacity: 0; pointer-events: none; }
  .loading img { width: 72px; height: 72px; animation: bob 1.4s ease-in-out infinite; filter: drop-shadow(0 0 18px rgba(255, 61, 207, 0.6)); }
  .loading p { font: 10px/1 var(--pixel); color: var(--cyan); letter-spacing: 0.1em; }
  .loading p::after { content: '...'; display: inline-block; width: 3ch; text-align: left; animation: dots 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
  .loading .lb { width: 180px; height: 10px; border: 1px solid var(--line); padding: 2px; }
  .loading .lb i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--magenta), var(--cyan)); animation: load 1.3s ease-in-out infinite; }
  .missing { position: absolute; inset: 0; display: grid; place-content: center; gap: 16px; text-align: center; padding: 24px; font: 11px/1.8 var(--pixel); color: var(--muted); }
  .missing a { color: var(--gold); }
  /* fallback when the Fullscreen API is missing (iPhone Safari): hide the bar, keep a small exit button */
  body.max .bar { display: none; }
  .exit { display: none; position: fixed; top: max(8px, env(safe-area-inset-top)); right: max(8px, env(safe-area-inset-right)); z-index: 3; width: 36px; height: 36px; padding: 0; justify-content: center; background: rgba(10, 8, 24, 0.7); }
  body.max .exit { display: inline-flex; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  @keyframes dots { from { width: 0; } to { width: 4ch; } }
  @keyframes load { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  @media (max-width: 520px) { .btn span { display: none; } .btn { padding: 0 10px; } .brand { display: none; } h1 { font-size: 9px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <a class="btn" id="back" href="./#level-1" aria-label="All games"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 2h2v2h-2zM8 4h2v2H8zM6 6h2v4H6zM8 10h2v2H8zM10 12h2v2h-2z"/></svg><span>ALL GAMES</span></a>
  <img class="brand" src="art/logo.webp" width="26" height="26" alt="">
  <h1 id="title">Loading</h1>
  <button class="btn fs" id="fs" type="button" aria-label="Fullscreen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1 1h5v2H3v3H1zM10 1h5v5h-2V3h-3zM1 10h2v3h3v2H1zM13 10h2v5h-5v-2h3z"/></svg><span>FULLSCREEN</span></button>
</header>
<main class="stage" id="stage">
  <div class="loading" id="loading"><img src="art/logo.webp" alt=""><p>LOADING</p><div class="lb"><i></i></div></div>
</main>
<button class="btn exit" id="exit" type="button" aria-label="Exit fullscreen"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1h2v5H1V4h3zM10 1h2v3h3v2h-5zM1 10h5v5H4v-3H1zM10 10h5v2h-3v3h-2z"/></svg></button>

<script src="games.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get('g');
  const game = (window.GAMES || []).find((g) => g.slug === slug && g.play);
  const stage = document.getElementById('stage');
  const loading = document.getElementById('loading');
  const title = document.getElementById('title');

  if (!game) {
    loading.remove();
    document.getElementById('fs').style.display = 'none';
    title.textContent = 'Game not found';
    const m = document.createElement('div');
    m.className = 'missing';
    m.innerHTML = '<p>GAME NOT FOUND</p><p><a href="./">Back to all games</a></p>';
    stage.append(m);
  } else {
    title.textContent = game.title;
    // back to the floor this game lives on
    document.getElementById('back').href = `./#level-${window.GAMES.indexOf(game) + 1}`;
    document.title = `${game.title} · 25 Games by New Year`;
    const frame = document.createElement('iframe');
    frame.title = game.title;
    frame.allow = 'fullscreen; autoplay; gamepad; clipboard-write';
    frame.addEventListener('load', () => {
      setTimeout(() => loading.classList.add('done'), 250);
      // so key presses go to the game right away
      try { frame.contentWindow.focus(); } catch { frame.focus(); }
    });
    frame.src = game.play;
    stage.append(frame);

    const fsBtn = document.getElementById('fs');
    const canFs = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    const setMax = (on) => document.body.classList.toggle('max', on);
    fsBtn.addEventListener('click', () => {
      if (canFs) {
        const req = frame.requestFullscreen || frame.webkitRequestFullscreen;
        Promise.resolve(req.call(frame)).catch(() => setMax(true));
      } else setMax(true);
      setTimeout(() => { try { frame.contentWindow.focus(); } catch {} }, 100);
    });
    document.getElementById('exit').addEventListener('click', () => setMax(false));
  }
</script>
</body>
</html>
